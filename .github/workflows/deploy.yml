# This is a basic workflow that is manually triggered

name: Deploy dapps
# Controls when the action will run. Workflow runs when manually triggered using the UI
# or API.
on:
  workflow_dispatch:
    inputs:
      contract:
        description: Root contract to deploy, or all for the legacy matrix
        required: true
        default: all
        type: choice
        options:
          - all
          - coupons
      environment:
        description: Surfboard network environment
        required: true
        default: testnet
        type: choice
        options:
          - testnet
          - mainnet

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  deploy-root:
    if: ${{ inputs.contract == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        sc:
          [
            breeder,
            farming,
            baby_Duck_Breeding,
            baby_Duck,
            incubator,
            renting,
            burn,
            action_Wrapper,
            marketplace,
            marketplace_Proxy,
            egg_Dispenser,
            ref_Contract,
            rebirth,
            coupons,
          ]
    runs-on: ubuntu-latest
    name: ${{ matrix.sc }}
    steps:
      - name: "check if ${{matrix.sc}} exists"
        env:
          super_secret: ${{ secrets[matrix.sc] }}
        if: ${{ env.super_secret == '' }}
        run: exit 1

      - uses: actions/checkout@v3
      - name: Install Waves Surfboard
        run: npm install --no-save @waves/surfboard@2.3.1-beta.1 @waves/js-test-env@1.1.5-beta.1

      - name: deploy ${{ matrix.sc }}
        run: npx surfboard run deploy-scripts/dapp.deploy.js --env=${{ inputs.environment }}
        env:
          FILE: ${{ matrix.sc }}
          SEED: ${{ secrets[matrix.sc] }}

  deploy-subdir:
    if: ${{ inputs.contract == 'all' }}
    strategy:
      fail-fast: false
      matrix:
        sc:
          [
            artefacts_ticket_Raffle,
            artefacts_items,
            artefacts_wearables,
            artefacts_acc_Booster,
            games_hunt,
            turtle_breeder,
            turtle_incubator,
            turtle_staking,
            turtle_rebirth,
          ]
    runs-on: ubuntu-latest
    name: ${{ matrix.sc }}
    steps:
      - name: "check if ${{matrix.sc}} exists"
        env:
          super_secret: ${{ secrets[matrix.sc] }}
        if: ${{ env.super_secret == '' }}
        run: exit 1

      - uses: actions/checkout@v3
      - name: Install Waves Surfboard
        run: npm install --no-save @waves/surfboard@2.3.1-beta.1 @waves/js-test-env@1.1.5-beta.1

      - name: deploy ${{ matrix.sc }}
        run: npx surfboard run deploy-scripts/dapp-sub.deploy.js --env=${{ inputs.environment }}
        env:
          FILE: ${{ matrix.sc }}
          SEED: ${{ secrets[matrix.sc] }}

  deploy-one-root:
    if: ${{ inputs.contract != 'all' }}
    runs-on: ubuntu-latest
    name: ${{ inputs.contract }} (${{ inputs.environment }})
    steps:
      - name: Check deployment secret
        env:
          super_secret: ${{ inputs.environment == 'testnet' && secrets.COUPONS_ACCEPTANCE || secrets[inputs.contract] }}
        if: ${{ env.super_secret == '' }}
        run: exit 1

      - uses: actions/checkout@v3
      - name: Install Waves Surfboard
        run: npm install --no-save @waves/surfboard@2.3.1-beta.1 @waves/js-test-env@1.1.5-beta.1

      - name: Deploy ${{ inputs.contract }} to ${{ inputs.environment }}
        run: npx surfboard run deploy-scripts/dapp.deploy.js --env=${{ inputs.environment }}
        env:
          FILE: ${{ inputs.contract }}
          SEED: ${{ inputs.environment == 'testnet' && secrets.COUPONS_ACCEPTANCE || secrets[inputs.contract] }}
